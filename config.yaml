app:
  name: tale-of-the-tape
  addr: "127.0.0.1:3000"
  timezone: America/New_York
storage:
  path: data/tale-of-the-tape.db
  imports_path: data/imports
  backups_path: backups
  busy_timeout: 5s
import:
  default_broker: thinkorswim
  assumed_timezone: America/New_York
  calendar_attribution: exit_date
  scratch_tolerance: 0.01
  maximum_upload_mb: 25
massive:
  api_key: ""
  request_timeout: 30s
  maximum_retries: 6
  chart_bar_size: 1m
  chart_padding_before: 30m
  chart_padding_after: 30m
  prefer_nbbo_for_excursions: true
  fallback_to_trades: true
  persist_raw_quotes: false
  persist_raw_trades: false
chart:
  include_extended_hours: true
  default_timeframe: 1m
  enabled_indicators: [vwap, sma9, sma20, ema9, ema20, bollinger20, volume]
analytics:
  kelly_minimum_sample: 30
  default_date_range: month_to_date
  include_commissions_and_fees: true
